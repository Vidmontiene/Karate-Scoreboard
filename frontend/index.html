<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css"> 
  <title>"Karate Scoreboard"</title>
</head>
<body>
  <div id="tempo"><p id="cronometro">01:00</p></div>

  <div id="placar">
    <div id="lado_esquerdo">

      <button class="ponto" id="botao_ponto_esq">
        <p class="valores" id="ponto_esq"></p>
      </button>

      <button class="senshu" id="botao_senshu_esq">
        <p class="valores" id="senshu_esq"></p>
      </button>

      <button class="penalidades" id="botao_penalidade_esq">
        <p class="valores" id="penalidade_esq"></p>
      </button>
    </div>  

    <div id="lado_direito">

      <button class="ponto" id="botao_ponto_dir">
        <p class="valores" id="ponto_dir"></p>
      </button>

      <button class="senshu" id="botao_senshu_dir">
        <p class="valores" id="senshu_dir"></p>
      </button>

      <button class="penalidades" id="botao_penalidade_dir">
        <p class="valores" id="penalidade_dir"></p>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
